<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="sereneGoldMain" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#f3cb65" />
      <stop offset="50%" stop-color="#d4a034" />
      <stop offset="75%" stop-color="#a67319" />
      <stop offset="100%" stop-color="#e0b246" />
    </linearGradient>

    <!-- Warm Highlight Ribbon Gradient -->
    <linearGradient id="sereneGoldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#fae49d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c59226" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Soft Gold Ambient Shadow -->
    <filter id="sereneGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7c530b" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#d4a034" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#sereneGlow)">
    <!-- Main Harmonious Tooth Contour -->
    <path
      d="M 50 23
         C 41 15, 26 16, 21 28
         C 16 38, 18 56, 26 73
         C 30 81, 36 87, 42 87
         C 46 87, 48 81, 46 72
         C 45 61, 47 52, 50 52
         C 53 52, 55 61, 54 72
         C 52 81, 54 87, 58 87
         C 64 87, 70 81, 74 73
         C 82 56, 84 38, 79 28
         C 74 16, 59 15, 50 23
         Z"
      fill="url(#sereneGoldMain)"
    />

    <!-- Elegant 'S' Curve & Radiant Smile Ribbon traversing the tooth -->
    <path
      d="M 32 35
         C 40 27, 58 29, 64 39
         C 68 45, 66 52, 58 57
         C 48 63, 38 68, 41 76
         C 43 82, 50 84, 57 82
         C 61 80, 64 77, 66 74
         C 65 77, 60 84, 52 85
         C 43 86, 36 81, 35 73
         C 33 63, 44 57, 54 52
         C 62 48, 64 43, 60 38
         C 56 32, 42 30, 34 37
         Z"
      fill="url(#sereneGoldRibbon)"
    />

    <!-- Diamond Sparkle Accent on Upper Right Cusp -->
    <path
      d="M 77 15
         C 77 20, 79 22, 84 22
         C 79 22, 77 24, 77 29
         C 77 24, 75 22, 70 22
         C 75 22, 77 20, 77 15
         Z"
      fill="#ffffff"
    />
    <circle cx="77" cy="22" r="1.5" fill="#fff8db" />
  </g>
</svg>
